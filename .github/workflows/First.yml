name: First

on:
  push:
    branches:
      - Feature

env:
  USER_NAME: "Diego Rojas"
  USER_PASSWORD: ${{ secrets.PASSWORD_ACTION }}

jobs:

  greeting:

    runs-on: ubuntu-latest

    steps:
      - name: textos
        run: |
          echo "Hello world! I am ${{ env.USER_NAME }}"
          echo "password: ${{ env.USER_PASSWORD }}"
          echo "My OS is: ${{ runner.os }}"
          echo "My GitHub is: ${{ github.actor }}"
          echo "The name's repository is: ${{ github.repository }}"